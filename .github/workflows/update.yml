name: Update listings

on:
  # Each run starts the next one (the last step), so the site updates every 20 minutes without relying on these
  # timers: GitHub starts scheduled runs late or not at all (most of the hourly ones never ran). The timers stay
  # as a way back in if the chain of runs ever breaks.
  schedule:
    - cron: "17 11 * * *"       # once a day (UTC, about 6:17 am Eastern): refresh every store
    - cron: "37 * * * *"        # every hour: a cycle run, as below
  workflow_dispatch:            # "Run workflow" by hand refreshes every store; the runs start each other with "cycle"
    inputs:
      mode:
        description: "full: refresh every store. cycle: refresh the stores read longest ago."
        type: choice
        options: [full, cycle]
        default: full
  push:                         # a change to the page republishes it; a change to the stores or the build runs a cycle
    branches: [main]
    paths: ["docs/**", "build.py", "history.py", "listings.py", "stores.json", ".github/workflows/update.yml"]

permissions:
  contents: write               # to replace the data branch
  pages: write                  # to publish the site
  id-token: write               # required by the Pages deploy action
  actions: write                # to start the next run

concurrency:                    # one run at a time, so two never race on the data branch
  group: update-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # full: every store. cycle: the 95 stores read longest ago, so with a run every 20 minutes each store comes
      # round about once an hour. publish: a page change, so no fetching at all.
      - name: Decide what to run
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import json, os, subprocess
          event, e = os.environ["GITHUB_EVENT_NAME"], json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          if event == "push":
              # ask git which files the push changed (the checkout is shallow, so fetch the commit before it first)
              try:
                  subprocess.run(["git", "fetch", "-q", "--depth=1", "origin", e["before"]], check=True)
                  changed = set(subprocess.run(["git", "diff", "--name-only", e["before"], "HEAD"], check=True,
                                               capture_output=True, text=True).stdout.split())
              except Exception:
                  changed = {"build.py"}             # can't tell: treat it as a change to the build
              rebuild = {"build.py", "history.py", "listings.py", "stores.json", ".github/workflows/update.yml"}
              # A change to the build or the stores is a cycle run, not a refresh of every store: several pushes
              # in an hour each re-read all 290 stores, and the stores began refusing the runs (HTTP 429).
              # New stores have never been read, so a cycle takes them first.
              mode = "cycle" if changed & rebuild else "publish"
          elif event == "schedule" and e.get("schedule") == "37 * * * *":
              mode = "cycle"
          elif event == "workflow_dispatch" and (e.get("inputs") or {}).get("mode") == "cycle":
              mode = "cycle"
          else:
              mode = "full"
          print(f"MODE={mode}")
          print(f"REBUILD={'false' if mode == 'publish' else 'true'}")
          EOF

      # What is tracked about every product (state/, one file per store), each store's in-stock items that are not
      # on the list (catalog/), the latest listings (data.json) and the metrics (metrics.json) live on the "data"
      # branch, which always holds a single commit: every update replaces it, so the repository does not grow by
      # tens of megabytes a day. A store's files only change when that store is read, so an hourly run uploads little.
      - name: Get the latest data
        run: |
          before="$RUNNER_TEMP/before"
          mkdir -p data "$before"
          git fetch --depth=1 origin data
          git archive FETCH_HEAD | tar -x -C "$before"
          cp "$before/data.json" docs/data.json
          if [ -f "$before/metrics.json" ]; then cp "$before/metrics.json" docs/metrics.json; fi
          if [ -d "$before/state" ]; then cp -r "$before/state" data/state; fi
          if [ -d "$before/catalog" ]; then cp -r "$before/catalog" data/catalog; fi
          if [ -f "$before/state.json" ]; then cp "$before/state.json" data/state.json; fi   # the format before one file per store
          # what a browser found at the stores no plain request reaches, from the harvest's own branch (see
          # .github/workflows/harvest.yml); the branch is missing until the first harvest saves one
          mkdir -p data/harvest "$RUNNER_TEMP/harvest"
          if git fetch --depth=1 origin harvest; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/harvest"
            cp -r "$RUNNER_TEMP/harvest/harvest/." data/harvest/ 2>/dev/null || true
          fi
          ls data/harvest

      - name: Fetch stores and build data
        if: env.REBUILD == 'true'
        run: |
          echo "mode: $MODE"
          if [ "$MODE" = cycle ]; then python3 build.py --stalest 95; else python3 build.py; fi

      # The page's per-brand files (docs/brands/) are made from the catalogue. A build makes them itself; when only
      # the page changed, make them here so the published site still has them.
      - name: Regroup the catalogue by brand
        if: env.REBUILD != 'true'
        run: python3 build.py --brands

      # A run that reads stores badly (a network problem, say) could find far fewer items. Saving its result would
      # lose good price history, so stop instead; the site keeps the previous data until the next run.
      - name: Check the new data before saving it
        if: env.REBUILD == 'true'
        run: |
          python3 - "$RUNNER_TEMP/before" data <<'EOF'
          import glob, json, os, sys
          def products(root):
              n = sum(len(json.load(open(p, encoding="utf-8"))["products"]) for p in glob.glob(root + "/state/*.json"))
              old = root + "/state.json"                 # the format before one file per store
              return n or (len(json.load(open(old, encoding="utf-8"))["prices"]) if os.path.exists(old) else 0)
          before, after = products(sys.argv[1]), products(sys.argv[2])
          print(f"products tracked: {before} before, {after} after")
          if after < 0.8 * before:
              sys.exit(f"The new tracking files hold {after} products, under 80% of the {before} before. Not saving them.")
          EOF

      # Replace the data branch with one fresh commit holding those files (built in a separate index, so the
      # checked-out page files are left alone for the publish step).
      - name: Save the data
        if: env.REBUILD == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp docs/data.json docs/metrics.json "$out/"
          cp -r data/state "$out/state"
          cp -r data/catalog "$out/catalog"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data.index"
          git --git-dir="$PWD/.git" --work-tree="$out" add -A .
          commit=$(git commit-tree "$(git write-tree)" -m "Listings and price history, $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # The deploy asks GitHub for the bundle the step above uploaded. Asked in the same second, GitHub sometimes
      # answers that no such bundle exists yet ("No artifacts named "github-pages" were found"): 14 runs failed
      # that way, with the data saved but the page not published. So wait a little first, and if the deploy
      # still fails, wait longer and try once more; only that second try can fail the run.
      - name: Let the upload settle
        run: sleep 10

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: redeploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Start the next run 20 minutes after this one began, as a "cycle" run. If another run is already waiting
      # (a push, a timer that did fire), stop at once and let that one carry on the chain: only one waits at a
      # time. This runs even when an earlier step failed, so one bad run doesn't end the updates. Cancelling a
      # run does end them, until a timer or a push starts a run again; to stop updates for good, disable this
      # workflow in the repository's Actions tab.
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED=${STARTED:-$(date +%s)}   # if the run failed before noting its start, count the wait from now
          waiting() {   # how many runs of this workflow are queued behind this one (0 if the question fails)
            n=$(gh run list --workflow update.yml --limit 30 --json status \
                  --jq '[.[] | select(.status != "completed" and .status != "in_progress")] | length' 2>/dev/null) || n=0
            echo "${n:-0}"
          }
          while [ "$(date +%s)" -lt $(( STARTED + 1200 )) ]; do
            if [ "$(waiting)" != 0 ]; then echo "another run is waiting; it carries on from here"; exit 0; fi
            sleep 30
          done
          if [ "$(waiting)" != 0 ]; then echo "another run is waiting; it carries on from here"; exit 0; fi
          gh workflow run update.yml --ref main -f mode=cycle
