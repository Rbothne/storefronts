name: Update listings

on:
  schedule:
    - cron: "17 11,23 * * *"   # twice a day (UTC): about 6:17 am and 6:17 pm Eastern
  workflow_dispatch:            # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stores and build data
        run: python3 build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Update listings"
          # The build takes a while; pick up anything pushed meanwhile so the push is not rejected.
          # If data was pushed meanwhile too (a build run by hand), this run's fresh data wins
          # (during a rebase, "theirs" is the commit being replayed: ours).
          git pull --rebase -X theirs
          git push
