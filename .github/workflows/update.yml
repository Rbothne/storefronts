name: Update listings

on:
  schedule:
    - cron: "17 11 * * *"       # once a day (UTC, about 6:17 am Eastern): refresh every store
    - cron: "37 * * * *"        # every hour: refresh the 50 stores updated longest ago
  workflow_dispatch:            # "Run workflow" by hand: refresh every store
  push:                         # a change to the page republishes it; a change to the stores or the build refreshes everything
    branches: [main]
    paths: ["docs/**", "build.py", "history.py", "stores.json", ".github/workflows/update.yml"]

permissions:
  contents: write               # to replace the data branch
  pages: write                  # to publish the site
  id-token: write               # required by the Pages deploy action

concurrency:                    # one run at a time, so two never race on the data branch
  group: update-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # full: every store. hourly: the stores updated longest ago (each store comes round every few hours, and short
      # runs are less likely to be rate-limited). publish: a page change, so no fetching at all.
      - name: Decide what to run
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import json, os, subprocess
          event, e = os.environ["GITHUB_EVENT_NAME"], json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          if event == "push":
              # ask git which files the push changed (the checkout is shallow, so fetch the commit before it first)
              try:
                  subprocess.run(["git", "fetch", "-q", "--depth=1", "origin", e["before"]], check=True)
                  changed = set(subprocess.run(["git", "diff", "--name-only", e["before"], "HEAD"], check=True,
                                               capture_output=True, text=True).stdout.split())
              except Exception:
                  changed = {"build.py"}             # can't tell: refresh everything to be safe
              rebuild = {"build.py", "history.py", "stores.json", ".github/workflows/update.yml"}
              mode = "full" if changed & rebuild else "publish"
          elif event == "schedule" and e.get("schedule") == "37 * * * *":
              mode = "hourly"
          else:
              mode = "full"
          print(f"MODE={mode}")
          print(f"REBUILD={'false' if mode == 'publish' else 'true'}")
          EOF

      # What is tracked about every product (state/, one file per store), the latest listings (data.json) and the
      # metrics (metrics.json) live on the "data" branch, which always holds a single commit: every update replaces
      # it, so the repository does not grow by tens of megabytes a day. A store's file only changes when that store
      # is read, so an hourly run uploads little.
      - name: Get the latest data
        run: |
          before="$RUNNER_TEMP/before"
          mkdir -p data "$before"
          git fetch --depth=1 origin data
          git archive FETCH_HEAD | tar -x -C "$before"
          cp "$before/data.json" docs/data.json
          if [ -f "$before/metrics.json" ]; then cp "$before/metrics.json" docs/metrics.json; fi
          if [ -d "$before/state" ]; then cp -r "$before/state" data/state; fi
          if [ -f "$before/state.json" ]; then cp "$before/state.json" data/state.json; fi   # the format before one file per store

      - name: Fetch stores and build data
        if: env.REBUILD == 'true'
        run: |
          echo "mode: $MODE"
          if [ "$MODE" = hourly ]; then python3 build.py --stalest 50; else python3 build.py; fi

      # A run that reads stores badly (a network problem, say) could find far fewer items. Saving its result would
      # lose good price history, so stop instead; the site keeps the previous data until the next run.
      - name: Check the new data before saving it
        if: env.REBUILD == 'true'
        run: |
          python3 - "$RUNNER_TEMP/before" data <<'EOF'
          import glob, json, os, sys
          def products(root):
              n = sum(len(json.load(open(p, encoding="utf-8"))["products"]) for p in glob.glob(root + "/state/*.json"))
              old = root + "/state.json"                 # the format before one file per store
              return n or (len(json.load(open(old, encoding="utf-8"))["prices"]) if os.path.exists(old) else 0)
          before, after = products(sys.argv[1]), products(sys.argv[2])
          print(f"products tracked: {before} before, {after} after")
          if after < 0.8 * before:
              sys.exit(f"The new tracking files hold {after} products, under 80% of the {before} before. Not saving them.")
          EOF

      # Replace the data branch with one fresh commit holding those files (built in a separate index, so the
      # checked-out page files are left alone for the publish step).
      - name: Save the data
        if: env.REBUILD == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp docs/data.json docs/metrics.json "$out/"
          cp -r data/state "$out/state"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data.index"
          git --git-dir="$PWD/.git" --work-tree="$out" add -A .
          commit=$(git commit-tree "$(git write-tree)" -m "Listings and price history, $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
